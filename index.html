<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light only"><title>Smart Upkeep Ideas | Swipe To Vote</title>
<meta name="description" content="Swipe through improvement ideas for the Smart Upkeep app.">
<link rel="icon" href="A-roof-chevron.svg">
<link href="https://fonts.googleapis.com/css2?family=Khand:wght@600;700&family=Hind:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="brand-tokens.css">
<style>
:root{--ink:#0a0a0a;--navy:#171717;--mute:#737373;--line:#e5e5e5;--bg:#fff;--soft:#f5f5f5;--cream:#FBF8F2;--sel:#F3EDE2;--no:#A4161A;--yes:#0B6E4F;--love:#df2225;--maybe:#9A6F00;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}body{background:#fff;color:var(--ink);font:16px/1.5 Hind,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:Khand,sans-serif;font-weight:700;line-height:1.05;margin:0}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px}
header img{height:30px}header .ct{margin-left:auto;font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#525252}
.pg{height:3px;background:var(--line)}.pg i{display:block;height:3px;background:var(--navy);transition:width .25s cubic-bezier(.2,.8,.2,1)}
main{max-width:560px;margin:0 auto;padding:14px 12px 120px}
.hero{background:var(--cream);border:1px solid var(--line);padding:14px 16px;margin-bottom:12px}
.eb{font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#525252}
.rule{width:36px;height:1px;background:var(--ink);margin:8px 0}
.hero h1{font-size:30px;letter-spacing:-.8px}.hero p{margin:6px 0 0;color:#525252;font-size:14px}
.stage{position:relative;touch-action:pan-y}
.card{background:#fff;border:1px solid var(--line);padding:16px;position:relative;will-change:transform;user-select:none}
.card.anim{transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s}
.card h2{font-size:28px;letter-spacing:-.5px;margin:4px 0 8px}
.card p.w{margin:0 0 12px;font-size:15.5px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:0}.ba div{border:1px solid var(--line);padding:10px;font-size:14px;line-height:1.35;margin-left:-1px}
.ba b{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px}.ba .af{background:var(--sel);border-color:#171717}
.shot{margin-top:10px;border:1px solid var(--line);background:var(--soft);max-height:230px;overflow:hidden}.shot img{display:block;width:100%;height:auto}
.shot figcaption{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:5px 8px;background:#fff;border-top:1px solid var(--line)}
.stamp{position:absolute;top:14px;padding:4px 10px;border:2px solid;font:700 16px Khand,sans-serif;letter-spacing:.1em;text-transform:uppercase;opacity:0;background:#fff}
.stamp.l{right:14px;color:var(--no)}.stamp.r{left:14px;color:var(--yes)}
.mine{display:inline-block;margin-left:6px;padding:1px 7px;border:1px solid;font-size:10.5px;letter-spacing:.12em}
label.nl{display:block;margin-top:12px;font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
textarea{width:100%;min-height:62px;margin-top:4px;border:1px solid #d4d4d4;border-radius:0;padding:8px 10px;font:inherit;font-size:16px;background:#fff;resize:vertical}
textarea:focus{outline:2px solid var(--navy);outline-offset:-1px}
.votes{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:12px}
.vb{min-height:52px;border:1px solid var(--navy);background:#fff;color:var(--navy);font:700 12px Hind,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:0}
.vb[data-a=No]{color:var(--no);border-color:var(--no)}.vb[data-a=Yes]{color:var(--yes);border-color:var(--yes)}.vb[data-a=Love]{color:var(--love);border-color:var(--love)}.vb[data-a=Maybe]{color:var(--maybe);border-color:var(--maybe)}
.vb.on{color:#fff!important}.vb[data-a=No].on{background:var(--no)}.vb[data-a=Yes].on{background:var(--yes)}.vb[data-a=Love].on{background:var(--love)}.vb[data-a=Maybe].on{background:var(--maybe)}
.hint{text-align:center;font-size:12px;color:var(--mute);margin:8px 0 0}
.nav{display:flex;justify-content:space-between;margin-top:10px}.lk{background:none;border:0;min-height:44px;font:700 11px Hind,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;color:var(--ink);padding:0 4px}
.end h2{font-size:32px}.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:12px 0}.stats div{border:1px solid var(--line);margin-left:-1px;padding:8px;text-align:center;background:#fff}.stats b{display:block;font:700 26px Khand}.stats span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.list{background:#fff;border:1px solid var(--line)}.list a{display:flex;gap:8px;padding:9px 12px;border-top:1px solid var(--line);font-size:14px;text-decoration:none;color:inherit;cursor:pointer}.list a:first-child{border-top:0}.list .tg{flex:0 0 50px;font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.bar button{width:100%;max-width:536px;min-height:50px;background:var(--navy);color:#fafafa;border:1px solid var(--navy);font:700 13px Hind,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;border-radius:0}
footer{text-align:center;font-size:12.5px;margin-top:26px}footer a{color:var(--mute);text-decoration:none;border-bottom:1px solid rgba(115,115,115,.4);display:inline-block;padding:4px 0}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#fff;border:1px solid var(--navy);padding:8px 14px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
@media(min-width:900px){main{max-width:640px;padding-top:28px}.card{padding:22px}.card h2{font-size:32px}}
</style></head><body>
<header><a class="dash-back" href="https://webermanapps.github.io/upkeep-cc-d36d3521/" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;padding:0 10px;color:#171717;text-decoration:none;font:600 14px/1 sans-serif;background:#fff"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>UpKeep Dashboard</a><img src="A-roof-chevron.svg" alt="Smart Upkeep"><span class="ct" id="ct"></span></header><div class="pg"><i id="pg" style="width:0"></i></div>
<main><section class="hero"><div class="eb">Smart Upkeep &middot; Improvement Ideas &middot; Oct 12, 2026</div><div class="rule"></div><h1>Swipe To Vote</h1><p>Swipe right for Yes, left for No, or tap Maybe or Love. Add a note if you like. Tap Submit when done.</p></section>
<div id="slot" data-no-ptr></div>
</main>
<div class="bar"><button class="mw-hover" id="share" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"/></svg> Share My Picks</button></div><div class="toast" id="toast" role="status"></div>
<script src="submit.js"></script>
<script>
const K='smartUpkeepIdeasVotes',DECK='2026-10-12';let ideas=[],i=0;
const S=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return{}}},W=o=>localStorage.setItem(K,JSON.stringify(o));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}
function counts(){const o=S();return ideas.filter(x=>o[x.id]&&o[x.id].answer).length}
function head(){const n=counts();$('#ct').textContent=(i<ideas.length?`Idea ${i+1} of ${ideas.length} · `:'')+`${n} Voted`;$('#pg').style.width=(100*n/ideas.length)+'%'}
function render(){head();if(i>=ideas.length)return end();const x=ideas[i],v=S()[x.id]||{};
$('#slot').innerHTML=`<div class="stage"><article class="card" id="card"><span class="stamp r">Yes</span><span class="stamp l">No</span>
<div class="eb">${esc(x.cat)}${v.answer?`<span class="mine">${esc(v.answer)}</span>`:''}</div><h2>${esc(x.title)}</h2><p class="w">${esc(x.what)}</p>
<div class="ba"><div><b>Before</b>${esc(x.before)}</div><div class="af"><b>After</b>${esc(x.after)}</div></div>
${x.img?`<figure class="shot" style="margin:10px 0 0"><img src="${esc(x.img)}" alt="Screenshot of the current app" loading="lazy" draggable="false"><figcaption>Today, On The Live App</figcaption></figure>`:''}
<label class="nl" for="note">Notes (Optional)</label><textarea id="note" placeholder="Anything to add? Saved with your vote.">${esc(v.note||'')}</textarea>
<div class="votes">${['No','Maybe','Love','Yes'].map(a=>`<button type="button" class="vb mw-hover ${v.answer===a?'on':''}" data-a="${a}">${a}</button>`).join('')}</div>
<p class="hint">← Swipe Left = No · Swipe Right = Yes →</p>
<div class="nav"><button class="lk" id="prev" type="button" ${i?'':'disabled'}>← Previous</button><button class="lk" id="skip" type="button">Skip →</button></div></article></div>`;
document.querySelectorAll('.vb').forEach(b=>b.onclick=()=>vote(b.dataset.a));
$('#note').oninput=e=>save({note:e.target.value});$('#prev').onclick=()=>{i=Math.max(0,i-1);render()};$('#skip').onclick=()=>{i++;render();scrollTo(0,0)};drag($('#card'))}
function save(p){const o=S(),x=ideas[i];o[x.id]={...o[x.id],...p,title:x.title,time:new Date().toISOString()};W(o);head()}
function vote(a,dir){const n=$('#note');save({answer:a,note:n?n.value:''});const c=$('#card');const dx=dir||(a==='No'?-1:a==='Yes'?1:0);
 c.classList.add('anim');c.style.transform=dx?`translateX(${dx*120}%) rotate(${dx*14}deg)`:'translateY(-24px) scale(.96)';c.style.opacity=0;setTimeout(()=>{i++;render();scrollTo({top:0})},230)}
function drag(c){let sx=0,sy=0,dx=0,on=false,lock=null;
 c.addEventListener('pointerdown',e=>{if(e.target.closest('textarea,button,a'))return;on=true;lock=null;sx=e.clientX;sy=e.clientY;dx=0;c.classList.remove('anim');try{c.setPointerCapture(e.pointerId)}catch(_){} });
 c.addEventListener('pointermove',e=>{if(!on)return;dx=e.clientX-sx;const dy=e.clientY-sy;if(lock===null&&(Math.abs(dx)>8||Math.abs(dy)>8))lock=Math.abs(dx)>Math.abs(dy);if(!lock)return;
  c.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`;c.querySelector('.stamp.r').style.opacity=Math.max(0,dx/100);c.querySelector('.stamp.l').style.opacity=Math.max(0,-dx/100)});
 const up=()=>{if(!on)return;on=false;if(lock&&Math.abs(dx)>90)return vote(dx>0?'Yes':'No',dx>0?1:-1);c.classList.add('anim');c.style.transform='';c.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0)};
 c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up)}
function end(){const o=S(),t={Love:0,Yes:0,Maybe:0,No:0};ideas.forEach(x=>{const a=(o[x.id]||{}).answer;if(a)t[a]++});
$('#slot').innerHTML=`<section class="end card"><div class="eb">All Done</div><h2>Your Picks</h2><div class="stats">${['Love','Yes','Maybe','No'].map(k=>`<div><b style="color:var(--${k.toLowerCase()})">${t[k]}</b><span>${k}</span></div>`).join('')}</div>
<div class="list">${ideas.map((x,k)=>{const v=o[x.id]||{};return`<a data-k="${k}"><span class="tg" style="color:var(--${(v.answer||'mute').toLowerCase()})">${esc(v.answer||'Skipped')}</span><span>${esc(x.title)}${v.note?`<br><i style="color:#525252">${esc(v.note)}</i>`:''}</span></a>`}).join('')}</div>
<div id="submitBox"></div><p class="hint">Tap any idea to change your vote. Then tap Submit to send your picks to Max.</p></section>`;
document.querySelectorAll('.list a').forEach(a=>a.onclick=()=>{i=+a.dataset.k;render();scrollTo(0,0)});
MWSubmit.button(document.getElementById('submitBox'),{agent:'upkeep',app:'smart-upkeep-ideas',deck:DECK,
getResults:()=>S(),
getNotes:()=>{const o=S();return ideas.map((x,k)=>{const v=o[x.id];return v&&v.note?`${k+1}. ${x.title}: ${v.note}`:null}).filter(Boolean).join('\n')}})}
function summary(){const o=S(),g={Love:[],Yes:[],Maybe:[],No:[]};ideas.forEach((x,k)=>{const v=o[x.id];if(v&&v.answer)g[v.answer].push(`${k+1}. ${x.title}${v.note?' ('+v.note+')':''}`)});
 const notesOnly=ideas.map((x,k)=>{const v=o[x.id];return v&&!v.answer&&v.note?`${k+1}. ${x.title} (${v.note})`:null}).filter(Boolean);
 let s=`Smart Upkeep Ideas ${DECK}: ${counts()}/${ideas.length} voted`;for(const k of['Love','Yes','Maybe','No'])if(g[k].length)s+=`\n\n${k}:\n`+g[k].join('\n');if(notesOnly.length)s+='\n\nNotes:\n'+notesOnly.join('\n');return s}
const isPhone=()=>/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied Picks and Link')}catch(_){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity=0;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied Picks and Link')}catch(e){prompt('Copy your picks:',t)}ta.remove()}}
$('#share').onclick=async()=>{const url=location.origin+location.pathname,text=summary()+'\n\n'+url;
 if(navigator.share){try{await navigator.share({title:'Smart Upkeep Ideas',text});return}catch(e){if(e&&e.name==='AbortError')return}}
 if(isPhone()){location.href='sms:?&body='+encodeURIComponent(text);return}await copyText(text)};
fetch('ideas.json?v='+DECK).then(r=>r.json()).then(j=>{ideas=j;const o=S();const f=ideas.findIndex(x=>!(o[x.id]&&o[x.id].answer));i=f<0?ideas.length:f;render()});
</script><script src="ptr.js" defer></script></body></html>
